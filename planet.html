
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Planet Simulation - Earth & Gas Giants</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: sans-serif; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; transition: opacity 1s; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="loading">Generating Planet...</div>

    <!-- Import maps for Three.js and addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm';

        // --- GLSL NOISE FUNCTIONS (Common for shaders) ---
        const glslNoise = `
            // Simplex 3D Noise 
            // by Ian McEwan, Ashima Arts
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

            float snoise(vec3 v){ 
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);

                // First corner
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 =   v - i + dot(i, C.xxx) ;

                // Other corners
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );

                //  x0 = x0 - 0.0 + 0.0 * C 
                vec3 x1 = x0 - i1 + 1.0 * C.xxx;
                vec3 x2 = x0 - i2 + 2.0 * C.xxx;
                vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;

                // Permutations
                i = mod(i, 289.0 ); 
                vec4 p = permute( permute( permute( 
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                          + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                          + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));

                // Gradients
                // ( N*N points uniformly over a square, mapped onto an octahedron.)
                float n_ = 1.0/7.0; // N=7
                vec3  ns = n_ * D.wyz - D.xzx;

                vec4 j = p - 49.0 * floor(p * ns.z *ns.z);  //  mod(p,N*N)

                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );    // mod(j,N)

                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);

                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );

                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));

                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;

                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);

                //Normalise gradients
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;

                // Mix final noise value
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), 
                                              dot(p2,x2), dot(p3,x3) ) );
            }

            // Fractal Brownian Motion
            float fbm(vec3 p, int octaves, float persistence, float lacunarity) {
                float amplitude = 1.0;
                float frequency = 1.0;
                float total = 0.0;
                float normalization = 0.0;

                for (int i = 0; i < octaves; ++i) {
                    total += amplitude * snoise(p * frequency);
                    normalization += amplitude;
                    amplitude *= persistence;
                    frequency *= lacunarity;
                }
                return total / normalization;
            }
        `;

        // --- SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3.5; 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1.5;
        controls.maxDistance = 20;

        // --- LIGHTING DATA ---
        // We prefer a fixed light direction for the shader to simplify calculations, 
        // effectively rotating the planet instead of the light for day/night cycles if needed,
        // but here we will just have a static sun relative to the camera or world.
        const sunDirection = new THREE.Vector3(1.0, 0.5, 1.0).normalize();

        // --- PLANET PARAMS ---
        const params = {
            planetType: 'earth', // 'earth' or 'gas'
            rotationSpeed: 0.05,
            planetSize: 1.0,      // Planet scale (0.5 to 2.0)
            seaLevel: 0.52,
            continentSize: 1.5,    // Lower frequency noise
            mountainHeight: 0.4,   // Displacement scale (0-1 range)
            roughness: 0.55,       // FBM Persistence
            detail: 6.0,           // FBM Lacunarity
            iceCapThreshold: 0.9,  // Latitude for ice
            colorDeepWater: "#002b4d",
            colorShallowWater: "#006994",
            colorBeach: "#d4c6a3",
            colorGrass: "#2a602a",
            colorForest: "#1a381a",
            colorMountain: "#666666",
            colorMountainHigh: "#888888",  // Higher altitude mountains
            colorSnow: "#ffffff",
            atmosphereDensity: 0.3,
            atmosphereColor: "#3a9eff",
            // Gas Planet Params
            gasPlanetSize: 1.0,    // Gas planet scale (0.5 to 2.0)
            gasStripeSpeed: 0.02,
            gasStripeFrequency: 3.0,
            gasStripeSharpness: 2.0,
            gasTurbulence: 0.75,
            gasColor1: "#d4a574",  // Jupiter-like beige
            gasColor2: "#8b6f47",  // Brown
            gasColor3: "#ffd4a3",  // Light beige
            gasColor4: "#5c4a2e",  // Dark brown
            gasColor5: "#f5e6d3"   // Cream
        };

        // Lock states for parameters (prevents randomization)
        const locks = {
            planetSize: false,
            seaLevel: false,
            continentSize: false,
            mountainHeight: false,
            roughness: false,
            detail: false,
            iceCapThreshold: false,
            colorDeepWater: false,
            colorShallowWater: false,
            colorBeach: false,
            colorGrass: false,
            colorForest: false,
            colorMountain: false,
            colorMountainHigh: false,
            colorSnow: false,
            atmosphereDensity: false,
            atmosphereColor: false,
            gasPlanetSize: false,
            gasStripeSpeed: false,
            gasStripeFrequency: false,
            gasStripeSharpness: false,
            gasTurbulence: false,
            gasColor1: false,
            gasColor2: false,
            gasColor3: false,
            gasColor4: false,
            gasColor5: false
        };

        const uniforms = {
            uTime: { value: 0 },
            uSunDirection: { value: sunDirection },
            uSeaLevel: { value: params.seaLevel },
            uContinentSize: { value: params.continentSize },
            uMountainHeight: { value: params.mountainHeight },
            uRoughness: { value: params.roughness },
            uDetail: { value: params.detail },
            uIceCapThreshold: { value: params.iceCapThreshold },
            uColorDeepWater: { value: new THREE.Color(params.colorDeepWater) },
            uColorShallowWater: { value: new THREE.Color(params.colorShallowWater) },
            uColorBeach: { value: new THREE.Color(params.colorBeach) },
            uColorGrass: { value: new THREE.Color(params.colorGrass) },
            uColorForest: { value: new THREE.Color(params.colorForest) },
            uColorMountain: { value: new THREE.Color(params.colorMountain) },
            uColorMountainHigh: { value: new THREE.Color(params.colorMountainHigh) },
            uColorSnow: { value: new THREE.Color(params.colorSnow) },
        };

        const gasUniforms = {
            uTime: { value: 0 },
            uSunDirection: { value: sunDirection },
            uStripeSpeed: { value: params.gasStripeSpeed },
            uStripeFrequency: { value: params.gasStripeFrequency },
            uStripeSharpness: { value: params.gasStripeSharpness },
            uTurbulence: { value: params.gasTurbulence },
            uColor1: { value: new THREE.Color(params.gasColor1) },
            uColor2: { value: new THREE.Color(params.gasColor2) },
            uColor3: { value: new THREE.Color(params.gasColor3) },
            uColor4: { value: new THREE.Color(params.gasColor4) },
            uColor5: { value: new THREE.Color(params.gasColor5) },
        };

        // --- TERRAIN SHADER ---
        const terrainVertexShader = `
            ${glslNoise}

            uniform float uTime;
            uniform float uContinentSize;
            uniform float uMountainHeight;
            uniform float uRoughness;
            uniform float uDetail;
            uniform float uSeaLevel;

            varying vec3 vNormal;
            varying vec3 vPosition;
            varying float vHeight;
            varying float vLatitude;

            void main() {
                vNormal = normalize(normalMatrix * normal);
                // Pass world position for consistent noise regardless of rotation if desired, 
                // but local 'position' works best for a planet that rotates as an object.
                vec3 pos = position; 

                // Base continent shape (low frequency)
                float h = fbm(pos * uContinentSize, 8, uRoughness, uDetail);
                
                // Ridged mountain noise (adds detail to landmasses)
                float hm = fbm(pos * uContinentSize * 4.0, 4, uRoughness, uDetail * 1.5);
                hm = 1.0 - abs(hm); // ridges
                hm = pow(hm, 3.0);
                
                // Combine and normalize roughly to [0, 1]
                float finalHeight = (h * 0.6 + hm * 0.4) + 0.5;

                vHeight = finalHeight;
                vLatitude = abs(normalize(pos).y); 

                // Displacement
                // Only displace if above sea level to keep ocean flat-ish (or keep it for sea bed)
                // Scale by 0.3 to maintain visual effect with 0-1 range (was 0.1 * 3.0 max)
                float displacement = 0.0;
                if (finalHeight > uSeaLevel) {
                     displacement = (finalHeight - uSeaLevel) * uMountainHeight * 0.3;
                }
                
                vec3 displacedPosition = pos + normal * displacement;
                vPosition = (modelMatrix * vec4(displacedPosition, 1.0)).xyz;

                gl_Position = projectionMatrix * modelViewMatrix * vec4(displacedPosition, 1.0);
            }
        `;

        const terrainFragmentShader = `
            uniform vec3 uSunDirection;
            uniform float uSeaLevel;
            uniform float uIceCapThreshold;
            
            uniform vec3 uColorDeepWater;
            uniform vec3 uColorShallowWater;
            uniform vec3 uColorBeach;
            uniform vec3 uColorGrass;
            uniform vec3 uColorForest;
            uniform vec3 uColorMountain;
            uniform vec3 uColorMountainHigh;
            uniform vec3 uColorSnow;

            varying vec3 vNormal;
            varying vec3 vPosition;
            varying float vHeight;
            varying float vLatitude;

            void main() {
                // Re-normalize normal interpolated across surface
                vec3 normal = normalize(vNormal);
                vec3 lightDir = normalize(uSunDirection);
                vec3 viewDir = normalize(cameraPosition - vPosition);

                // --- Lighting ---
                // Standard Diffuse
                float NdotL = max(dot(normal, lightDir), 0.0);
                float lightIntensity = NdotL;
                
                // Ambient
                vec3 ambient = vec3(0.02);

                // Specular (only for water)
                float specularStrength = 0.0;
                if (vHeight <= uSeaLevel) {
                     vec3 reflectDir = reflect(-lightDir, normal);
                     float spec = pow(max(dot(viewDir, reflectDir), 0.0), 32.0);
                     specularStrength = spec * 0.5;
                }

                // --- Color Mapping ---
                vec3 color;
                
                // Normalize height relative to sea level for easier coloring
                float h = vHeight;

                if (h <= uSeaLevel) {
                    // Water: mix deep and shallow based on depth
                    float waterDepth = smoothstep(uSeaLevel - 0.2, uSeaLevel, h);
                    color = mix(uColorDeepWater, uColorShallowWater, waterDepth);
                } else {
                    // Land: mix based on altitude
                    float alt = smoothstep(uSeaLevel, 1.0, h); // normalized land altitude
                    
                    color = mix(uColorBeach, uColorGrass, smoothstep(0.0, 0.05, alt));
                    color = mix(color, uColorForest, smoothstep(0.05, 0.3, alt));
                    // Mix between base mountain and high mountain colors
                    color = mix(color, uColorMountain, smoothstep(0.3, 0.5, alt));
                    color = mix(color, uColorMountainHigh, smoothstep(0.5, 0.7, alt));
                    color = mix(color, uColorSnow, smoothstep(0.7, 0.9, alt));
                }

                // Ice Caps based on latitude
                float ice = smoothstep(uIceCapThreshold - 0.1, uIceCapThreshold, vLatitude);
                // Ensure ice sits on top of water AND land
                if (vHeight <= uSeaLevel) {
                     // Sea ice might be slightly different color or smoother, but let's keep it simple
                     color = mix(color, uColorSnow * 0.9, ice);
                     if (ice > 0.5) specularStrength *= 0.1; // Less specular on ice
                } else {
                     color = mix(color, uColorSnow, ice);
                }

                // City Lights on dark side (simple height based mask)
                // Cities usually on low-lying land, not water, not high mountains, not ice.
                float night = 1.0 - lightIntensity;
                night = smoothstep(0.5, 0.8, night); // sharper transition for lights
                
                if (night > 0.0 && h > uSeaLevel && h < uSeaLevel + 0.3 && vLatitude < uIceCapThreshold - 0.1) {
                    // Use simple noise to patch city lights
                    float cityNoise = fract(sin(dot(vPosition.xy ,vec2(12.9898,78.233))) * 43758.5453);
                    // Filter cities by some noise so they aren't everywhere
                    if (cityNoise > 0.96) {
                         color += vec3(1.0, 0.8, 0.4) * night * 2.0; // Warm city lights
                    }
                }

                // Combine lighting
                vec3 finalColor = (ambient + lightIntensity) * color + vec3(specularStrength);

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // --- ATMOSPHERE SHADER ---
        const atmosphereVertexShader = `
            varying vec3 vNormal;
            varying vec3 vViewDir;

            void main() {
                vNormal = normalize(normalMatrix * normal);
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vViewDir = normalize(cameraPosition - worldPosition.xyz);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const atmosphereFragmentShader = `
            uniform vec3 uSunDirection;
            uniform vec3 uAtmosphereColor;
            uniform float uAtmosphereDensity;

            varying vec3 vNormal;
            varying vec3 vViewDir;

            void main() {
                // Rim lighting effect (Fresnel-ish)
                float viewDotNormal = dot(vViewDir, vNormal);
                // Invert because we are looking at it from outside
                float intensity = pow(0.6 - viewDotNormal, 2.5); 

                // Day/Night fading for atmosphere
                float lightIntensity = max(dot(vNormal, uSunDirection), 0.0);
                
                vec3 atmosphere = uAtmosphereColor * intensity * uAtmosphereDensity;
                
                // Boost it slightly on the sunlit side
                atmosphere *= (0.3 + 0.7 * smoothstep(-0.5, 1.0, lightIntensity));

                gl_FragColor = vec4(atmosphere, atmosphere.r + atmosphere.g + atmosphere.b);
            }
        `;

        // --- GAS PLANET SHADER ---
        const gasPlanetVertexShader = `
            ${glslNoise}

            uniform float uTime;
            uniform float uTurbulence;

            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec3 vLocalPos;
            varying float vLatitude;

            void main() {
                vNormal = normalize(normalMatrix * normal);
                vec3 pos = position;
                vLocalPos = pos;
                
                // Calculate latitude for stripe direction
                vLatitude = normalize(pos).y;
                
                // Subtle displacement for gas turbulence (very minimal)
                vec3 noisePos = pos * 2.0 + vec3(uTime * 0.05);
                float turbulence = snoise(noisePos) * uTurbulence * 0.01;
                vec3 displacedPosition = pos + normal * turbulence;
                
                vPosition = (modelMatrix * vec4(displacedPosition, 1.0)).xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(displacedPosition, 1.0);
            }
        `;

        const gasPlanetFragmentShader = `
            ${glslNoise}

            uniform float uTime;
            uniform vec3 uSunDirection;
            uniform float uStripeSpeed;
            uniform float uStripeFrequency;
            uniform float uStripeSharpness;
            uniform float uTurbulence;
            
            uniform vec3 uColor1;
            uniform vec3 uColor2;
            uniform vec3 uColor3;
            uniform vec3 uColor4;
            uniform vec3 uColor5;

            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec3 vLocalPos;
            varying float vLatitude;

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 lightDir = normalize(uSunDirection);
                vec3 viewDir = normalize(cameraPosition - vPosition);
                
                // Get latitude for horizontal stripes (normalized to [0, 1])
                float lat = (vLatitude + 1.0) * 0.5; // Normalize from [-1,1] to [0,1]
                
                // Calculate longitude for seamless wrapping around the planet
                float longitude = atan(vLocalPos.z, vLocalPos.x) / 3.14159; // [-1, 1]
                longitude = (longitude + 1.0) * 0.5; // Normalize to [0, 1]
                
                // Wrap time for seamless looping using fract
                // Scale time so one full cycle = 1.0
                float timeScale = uStripeSpeed * 0.5;
                float wrappedTime = fract(uTime * timeScale);
                
                // Create animated stripe pattern with seamless longitude wrapping
                // Use longitude that wraps from 0 to 2π for seamless noise
                float lonWrapped = longitude * 2.0 * 3.14159; // 0 to 2π
                
                // Create noise coordinates that wrap seamlessly around longitude
                vec3 noiseCoord = vec3(
                    lonWrapped + wrappedTime * 2.0,  // Wraps seamlessly at 2π
                    lat * uStripeFrequency * 2.0 + wrappedTime * uStripeFrequency * 2.0,
                    wrappedTime * 5.0  // Time component
                );
                
                // Multi-octave noise for complex patterns - all using wrapped longitude
                float n1 = snoise(noiseCoord);
                float n2 = snoise(noiseCoord * 2.0 + vec3(100.0)) * 0.5;
                float n3 = snoise(noiseCoord * 4.0 + vec3(200.0)) * 0.25;
                float turbulenceNoise = (n1 + n2 + n3) * uTurbulence;
                
                // Base stripe pattern (horizontal bands) - seamless loop
                // sin() naturally repeats every 2π, so the pattern will loop seamlessly
                float stripePhase = (lat + wrappedTime) * uStripeFrequency * 2.0 * 3.14159;
                float stripe = sin(stripePhase + turbulenceNoise * 2.0);
                
                // Add vertical swirls using longitude-based noise - ensure seamless wrapping
                vec3 swirlCoord = vec3(
                    lonWrapped + wrappedTime * 1.0,  // Wraps seamlessly
                    lat * 3.0,
                    wrappedTime * 5.0
                );
                float swirl = snoise(swirlCoord) * 0.3;
                
                // Combine stripe and swirl
                float pattern = stripe + swirl;
                
                // Sharpen the pattern
                pattern = pow(abs(pattern), 1.0 / uStripeSharpness) * sign(pattern);
                
                // Normalize to [0, 1] range
                pattern = pattern * 0.5 + 0.5;
                
                // Create multiple color bands using smooth transitions
                vec3 color;
                if (pattern < 0.2) {
                    color = mix(uColor1, uColor2, pattern / 0.2);
                } else if (pattern < 0.4) {
                    color = mix(uColor2, uColor3, (pattern - 0.2) / 0.2);
                } else if (pattern < 0.6) {
                    color = mix(uColor3, uColor4, (pattern - 0.4) / 0.2);
                } else if (pattern < 0.8) {
                    color = mix(uColor4, uColor5, (pattern - 0.6) / 0.2);
                } else {
                    color = mix(uColor5, uColor1, (pattern - 0.8) / 0.2);
                }
                
                // Add subtle color variation from noise
                vec3 colorNoise = vec3(
                    snoise(vLocalPos * 3.0 + vec3(0.0, uTime * 0.1, 0.0)),
                    snoise(vLocalPos * 3.0 + vec3(100.0, uTime * 0.1, 0.0)),
                    snoise(vLocalPos * 3.0 + vec3(200.0, uTime * 0.1, 0.0))
                ) * 0.1;
                color += colorNoise;
                
                // Lighting
                float NdotL = max(dot(normal, lightDir), 0.0);
                float lightIntensity = NdotL;
                
                // Ambient
                vec3 ambient = vec3(0.1);
                
                // Specular highlight for gas clouds
                vec3 reflectDir = reflect(-lightDir, normal);
                float spec = pow(max(dot(viewDir, reflectDir), 0.0), 16.0);
                float specularStrength = spec * 0.3;
                
                // Combine lighting
                vec3 finalColor = (ambient + lightIntensity) * color + vec3(specularStrength);
                
                // Add subtle rim glow
                float rim = pow(1.0 - max(dot(viewDir, normal), 0.0), 2.0);
                finalColor += color * rim * 0.2;
                
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // --- BUILD PLANET ---
        // Geometry: High detail icosahedron for smooth terrain deformation
        const geometry = new THREE.IcosahedronGeometry(1, 128); 
        
        const material = new THREE.ShaderMaterial({
            vertexShader: terrainVertexShader,
            fragmentShader: terrainFragmentShader,
            uniforms: uniforms,
            // wireframe: true
        });

        const gasMaterial = new THREE.ShaderMaterial({
            vertexShader: gasPlanetVertexShader,
            fragmentShader: gasPlanetFragmentShader,
            uniforms: gasUniforms,
        });

        const planet = new THREE.Mesh(geometry, material);
        scene.add(planet);
        
        // Initialize planet scale
        planet.scale.setScalar(params.planetSize);

        // Function to switch planet type
        function switchPlanetType(type) {
            if (type === 'gas') {
                planet.material = gasMaterial;
                // Update scale for gas planet
                planet.scale.setScalar(params.gasPlanetSize);
                atmosphere.scale.setScalar(params.gasPlanetSize * 1.15);
                // Hide clouds and atmosphere for gas planets (or adjust them)
                cloudMesh.visible = false;
                atmosphere.visible = false;
            } else {
                planet.material = material;
                // Update scale for rocky planet
                planet.scale.setScalar(params.planetSize);
                atmosphere.scale.setScalar(params.planetSize * 1.15);
                cloudMesh.scale.setScalar(params.planetSize * 1.03);
                cloudMesh.visible = true;
                atmosphere.visible = true;
            }
        }

        // --- BUILD ATMOSPHERE ---
        const atmoGeometry = new THREE.IcosahedronGeometry(1.15, 32); 
        const atmoMaterial = new THREE.ShaderMaterial({
            vertexShader: atmosphereVertexShader,
            fragmentShader: atmosphereFragmentShader,
            uniforms: {
                uSunDirection: { value: sunDirection },
                uAtmosphereColor: { value: new THREE.Color(params.atmosphereColor) },
                uAtmosphereDensity: { value: params.atmosphereDensity }
            },
            side: THREE.BackSide, // Render inside of the slightly larger sphere for better blending
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false // Don't block objects behind it
        });
        const atmosphere = new THREE.Mesh(atmoGeometry, atmoMaterial);
        scene.add(atmosphere);
        // Initialize atmosphere scale
        atmosphere.scale.setScalar(params.planetSize * 1.15);

        // --- BUILD CLOUDS ---
        // Simple textured sphere for clouds, rotating separately
        const cloudTextureCanvas = document.createElement('canvas');
        cloudTextureCanvas.width = 1024;
        cloudTextureCanvas.height = 512;
        // Generate simple cloud noise texture on CPU once
        const ctx = cloudTextureCanvas.getContext('2d');
        const imgData = ctx.createImageData(1024, 512);
        for(let i=0; i<imgData.data.length; i+=4) {
            const val = Math.random() * 255;
            imgData.data[i] = val;
            imgData.data[i+1] = val;
            imgData.data[i+2] = val;

                get value() {
                    // Convert actual value to percentage (0-100)
                    return ((params[paramName] - min) / (max - min) * 100);
                },
                set value(percent) {
                    // Convert percentage (0-100) to actual value
                    params[paramName] = min + (percent / 100) * (max - min);
                    if (onChange) onChange(params[paramName]);
                }
            };
            
            // Store wrapper reference for later updates
            percentWrappers[paramName] = percentWrapper;
            
            // Initialize percentage value
            percentWrapper.value = percentWrapper.value;
            
            // Slider showing only percentage
            const sliderCtrl = folder.add(percentWrapper, 'value', 0, 100).name(label).onChange(v => {
                // Value is already set in the setter, but ensure onChange is called
                if (onChange) onChange(params[paramName]);
            });
            
            // Format display to show percentage
            sliderCtrl.listen();
            
            return { slider: sliderCtrl, lock: lockCtrl, wrapper: percentWrapper };
        }
        
        // Helper function to add color with lock
        function addColorWithLock(folder, paramName, label, onChange) {
            // Lock button
            const lockObj = { locked: locks[paramName] };
            const lockCtrl = folder.add(lockObj, 'locked').name('🔒').onChange(v => {
                locks[paramName] = v;
                lockCtrl.name(v ? '🔒' : '🔓');
            });
            lockCtrl.name(locks[paramName] ? '🔒' : '🔓');
            
            // Color picker
            const colorCtrl = folder.addColor(params, paramName).name(label).onChange(v => {
                if (onChange) onChange(v);
            });
            
            return { color: colorCtrl, lock: lockCtrl };
        }
        
        // Planet Type Selector
        const planetTypeController = gui.add(params, 'planetType', { 'Earth-like': 'earth', 'Gas Planet': 'gas' }).name('Planet Type');
        planetTypeController.onChange(v => {
            switchPlanetType(v);
        });
        
        const folderTerrain = gui.addFolder('Terrain Generation');
        
        // Planet Size - automatically adjusts detail based on size
        const planetSizeCtrl = addSliderWithPercentAndLock(
            folderTerrain, 'planetSize', 'Planet Size', 0.5, 2.0,
            v => {
                planet.scale.setScalar(v);
                atmosphere.scale.setScalar(v * 1.15);
                cloudMesh.scale.setScalar(v * 1.03);
                
                // Scale detail with planet size: size 0.5 -> detail 3.0, size 2.0 -> detail 8.0
                // Linear mapping: detail = 3.0 + (size - 0.5) / (2.0 - 0.5) * (8.0 - 3.0)
                if (!locks.detail) {
                    const newDetail = 3.0 + ((v - 0.5) / 1.5) * 5.0;
                    // Update via wrapper to trigger slider update
                    if (percentWrappers.detail) {
                        // Calculate percentage: (value - min) / (max - min) * 100
                        const detailPercent = ((newDetail - 3.0) / (8.0 - 3.0)) * 100;
                        percentWrappers.detail.value = detailPercent;
                    } else {
                        // Fallback if wrapper not yet created
                        params.detail = newDetail;
                        uniforms.uDetail.value = params.detail;
                    }
                }
            }
        );
        
        // Sea Level
        addSliderWithPercentAndLock(
            folderTerrain, 'seaLevel', 'Sea Level', 0.0, 1.0,
            v => uniforms.uSeaLevel.value = v
        );
        
        // Continent Frequency
        addSliderWithPercentAndLock(
            folderTerrain, 'continentSize', 'Continent Freq', 0.1, 5.0,
            v => uniforms.uContinentSize.value = v
        );
        
        // Mountain Height
        addSliderWithPercentAndLock(
            folderTerrain, 'mountainHeight', 'Mtn Height', 0.0, 1.0,
            v => uniforms.uMountainHeight.value = v
        );
        
        // Roughness
        addSliderWithPercentAndLock(
            folderTerrain, 'roughness', 'Roughness', 0.1, 0.9,
            v => uniforms.uRoughness.value = v
        );
        
        // Detail (FBM Lacunarity) - auto-adjusted by planet size
        const detailSliderCtrl = addSliderWithPercentAndLock(
            folderTerrain, 'detail', 'Detail', 3.0, 8.0,
            v => uniforms.uDetail.value = v
        );
        
        // Ice Caps
        addSliderWithPercentAndLock(
            folderTerrain, 'iceCapThreshold', 'Ice Caps', 0.0, 1.0,
            v => uniforms.uIceCapThreshold.value = v
        );
        
        // Rocky Planet Presets and Randomize
        const folderRocky = gui.addFolder('Rocky Planet');
        const rockyPresetNames = Object.keys(rockyPlanetPresets);
        folderRocky.add({preset: 'Earth'}, 'preset', rockyPresetNames).name('Planet Preset').onChange(v => applyRockyPlanetPreset(v));
        folderRocky.add({randomize: () => randomizeRockyPlanet()}, 'randomize').name('🎲 Randomize');
        folderRocky.close();
        
        const folderColors = gui.addFolder('Colors');
        addColorWithLock(folderColors, 'colorDeepWater', 'Deep Water', v => uniforms.uColorDeepWater.value.set(v));
        addColorWithLock(folderColors, 'colorShallowWater', 'Shallow Water', v => uniforms.uColorShallowWater.value.set(v));
        addColorWithLock(folderColors, 'colorBeach', 'Beach', v => uniforms.uColorBeach.value.set(v));
        addColorWithLock(folderColors, 'colorGrass', 'Grass', v => uniforms.uColorGrass.value.set(v));
        addColorWithLock(folderColors, 'colorForest', 'Forest', v => uniforms.uColorForest.value.set(v));
        addColorWithLock(folderColors, 'colorMountain', 'Mountain', v => uniforms.uColorMountain.value.set(v));
        addColorWithLock(folderColors, 'colorMountainHigh', 'Mountain High', v => uniforms.uColorMountainHigh.value.set(v));
        addColorWithLock(folderColors, 'colorSnow', 'Snow', v => uniforms.uColorSnow.value.set(v));
        folderColors.close(); // Save space

        const folderAtmo = gui.addFolder('Atmosphere & Misc');
        addSliderWithPercentAndLock(
            folderAtmo, 'atmosphereDensity', 'Atmo Density', 0.0, 1.0,
            v => atmoMaterial.uniforms.uAtmosphereDensity.value = v
        );
        addColorWithLock(folderAtmo, 'atmosphereColor', 'Atmo Color', v => atmoMaterial.uniforms.uAtmosphereColor.value.set(v));
        folderAtmo.add(params, 'rotationSpeed', 0.0, 0.5).name('Rotation Speed').onChange(v => {});

        // Gas Planet Style Presets
        const gasPlanetPresets = {
            'Jupiter': {
                gasStripeSpeed: 0.02,
                gasStripeFrequency: 3.5,
                gasStripeSharpness: 2.0,
                gasTurbulence: 0.6,
                gasColor1: "#d4a574",
                gasColor2: "#8b6f47",
                gasColor3: "#ffd4a3",
                gasColor4: "#5c4a2e",
                gasColor5: "#f5e6d3"
            },
            'Saturn': {
                gasStripeSpeed: 0.015,
                gasStripeFrequency: 2.8,
                gasStripeSharpness: 1.8,
                gasTurbulence: 0.55,
                gasColor1: "#fad5a5",
                gasColor2: "#d4a574",
                gasColor3: "#ffebcd",
                gasColor4: "#b8860b",
                gasColor5: "#fff8dc"
            },
            'Neptune': {
                gasStripeSpeed: 0.025,
                gasStripeFrequency: 4.2,
                gasStripeSharpness: 2.5,
                gasTurbulence: 0.7,
                gasColor1: "#4169e1",
                gasColor2: "#1e90ff",
                gasColor3: "#87ceeb",
                gasColor4: "#0000cd",
                gasColor5: "#b0c4de"
            },
            'Uranus': {
                gasStripeSpeed: 0.022,
                gasStripeFrequency: 3.2,
                gasStripeSharpness: 2.2,
                gasTurbulence: 0.65,
                gasColor1: "#4fd0e7",
                gasColor2: "#87ceeb",
                gasColor3: "#b0e0e6",

            },
            'Exotic Purple': {
                gasStripeSpeed: 0.03,
                gasStripeFrequency: 4.8,
                gasStripeSharpness: 3.0,
                gasTurbulence: 0.85,
                gasColor1: "#9370db",
                gasColor2: "#8a2be2",
                gasColor3: "#ba55d3",
                gasColor4: "#4b0082",
                gasColor5: "#dda0dd"
            },
            'Fiery Red': {
                gasStripeSpeed: 0.028,
                gasStripeFrequency: 4.0,
                gasStripeSharpness: 2.8,
                gasTurbulence: 0.8,
                gasColor1: "#ff6347",
                gasColor2: "#dc143c",
                gasColor3: "#ff8c69",
                gasColor4: "#8b0000",
                gasColor5: "#ffa07a"
            },
            'Toxic Green': {
                gasStripeSpeed: 0.024,
                gasStripeFrequency: 4.5,
                gasStripeSharpness: 2.3,
                gasTurbulence: 0.75,
                gasColor1: "#32cd32",
                gasColor2: "#228b22",
                gasColor3: "#90ee90",
                gasColor4: "#006400",
                gasColor5: "#adff2f"
            }
        };

        // Function to apply a gas planet preset
        function applyGasPlanetPreset(presetName) {
            const preset = gasPlanetPresets[presetName];
            if (!preset) return;
            
            params.gasStripeSpeed = preset.gasStripeSpeed;
            params.gasStripeFrequency = preset.gasStripeFrequency;
            params.gasStripeSharpness = preset.gasStripeSharpness;
            params.gasTurbulence = preset.gasTurbulence;
            params.gasColor1 = preset.gasColor1;
            params.gasColor2 = preset.gasColor2;
            params.gasColor3 = preset.gasColor3;
            params.gasColor4 = preset.gasColor4;
            params.gasColor5 = preset.gasColor5;
            
            // Update uniforms
            gasUniforms.uStripeSpeed.value = preset.gasStripeSpeed;
            gasUniforms.uStripeFrequency.value = preset.gasStripeFrequency;
            gasUniforms.uStripeSharpness.value = preset.gasStripeSharpness;
            gasUniforms.uTurbulence.value = preset.gasTurbulence;
            gasUniforms.uColor1.value.set(preset.gasColor1);
            gasUniforms.uColor2.value.set(preset.gasColor2);
            gasUniforms.uColor3.value.set(preset.gasColor3);
            gasUniforms.uColor4.value.set(preset.gasColor4);
            gasUniforms.uColor5.value.set(preset.gasColor5);
            
            // Update GUI - update all controllers to reflect preset values
            gui.updateDisplay();
            
            // Update all controllers in gas planet folder
            if (typeof folderGas !== 'undefined' && folderGas.controllers) {
                folderGas.controllers.forEach(controller => {
                    // Update the object property if it exists
                    if (controller.object && controller.property && params.hasOwnProperty(controller.property)) {
                        controller.object[controller.property] = params[controller.property];
                    }
                    // Update display
                    if (controller.updateDisplay) {
                        controller.updateDisplay();
                    }
                });
            }
        }

        // Function to randomize gas planet
        function randomizeGasPlanet() {
            // Random properties within new ranges (only if not locked)
            if (!locks.gasPlanetSize) params.gasPlanetSize = Math.random() * 1.5 + 0.5; // 0.5 to 2.0
            if (!locks.gasStripeSpeed) params.gasStripeSpeed = Math.random() * 0.035;
            // Stripe frequency is automatically set based on planet size (unless locked)
            if (!locks.gasStripeFrequency) {
                params.gasStripeFrequency = 1.0 + ((params.gasPlanetSize - 0.5) / 1.5) * 4.0;
            }
            if (!locks.gasStripeSharpness) params.gasStripeSharpness = Math.random() * 3.0 + 1.0;
            if (!locks.gasTurbulence) params.gasTurbulence = Math.random() * 0.5 + 0.5; // 0.5 to 1.0
            
            // Random colors - generate harmonious color schemes
            const schemes = [
                // Monochromatic
                () => {
                    const baseHue = Math.random();
                    const sat = 0.6 + Math.random() * 0.4;
                    const light = 0.3 + Math.random() * 0.4;
                    return Array.from({length: 5}, (_, i) => {
                        const l = light + (Math.random() - 0.5) * 0.3;
                        return new THREE.Color().setHSL(baseHue, sat, l);
                    });
                },
                // Analogous
                () => {
                    const baseHue = Math.random();
                    return Array.from({length: 5}, (_, i) => {
                        const h = (baseHue + (i - 2) * 0.1 + 1) % 1;
                        return new THREE.Color().setHSL(h, 0.7, 0.4 + Math.random() * 0.3);
                    });
                },
                // Complementary
                () => {
                    const hue1 = Math.random();
                    const hue2 = (hue1 + 0.5) % 1;
                    return Array.from({length: 5}, (_, i) => {
                        const h = i < 2 ? hue1 : hue2;
                        return new THREE.Color().setHSL(h, 0.6 + Math.random() * 0.3, 0.4 + Math.random() * 0.3);
                    });
                }
            ];
            
            const colorScheme = schemes[Math.floor(Math.random() * schemes.length)]();
            const colors = colorScheme.map(c => '#' + c.getHexString());
            
            // Update params (only if not locked)
            if (!locks.gasColor1) params.gasColor1 = colors[0];
            if (!locks.gasColor2) params.gasColor2 = colors[1];
            if (!locks.gasColor3) params.gasColor3 = colors[2];
            if (!locks.gasColor4) params.gasColor4 = colors[3];
            if (!locks.gasColor5) params.gasColor5 = colors[4];
            
            // Update planet scale
            if (!locks.gasPlanetSize) {
                planet.scale.setScalar(params.gasPlanetSize);
                atmosphere.scale.setScalar(params.gasPlanetSize * 1.15);
            }
            
            // Update uniforms
            gasUniforms.uStripeSpeed.value = params.gasStripeSpeed;
            gasUniforms.uStripeFrequency.value = params.gasStripeFrequency;
            gasUniforms.uStripeSharpness.value = params.gasStripeSharpness;
            gasUniforms.uTurbulence.value = params.gasTurbulence;
            gasUniforms.uColor1.value.set(params.gasColor1);
            gasUniforms.uColor2.value.set(params.gasColor2);
            gasUniforms.uColor3.value.set(params.gasColor3);
            gasUniforms.uColor4.value.set(params.gasColor4);
            gasUniforms.uColor5.value.set(params.gasColor5);
            
            // Update GUI color controllers - find and update them
            if (typeof folderGas !== 'undefined' && folderGas.controllers) {
                const colorCtrlNames = ['gasColor1', 'gasColor2', 'gasColor3', 'gasColor4', 'gasColor5'];
                colorCtrlNames.forEach((colorName, index) => {
                    const controller = folderGas.controllers.find(c => c.property === colorName);
                    if (controller && controller.object) {
                        // Update the object property first
                        controller.object[controller.property] = colors[index];
                        // Then update the display
                        if (controller.updateDisplay) {
                            controller.updateDisplay();
                        }
                    }
                });
            }
            
            // Also try using stored colorControllers if available (defined later)
            if (typeof colorControllers !== 'undefined') {
                const colorNames = ['color1', 'color2', 'color3', 'color4', 'color5'];
                colorNames.forEach((name, index) => {
                    const controller = colorControllers[name];
                    if (controller && controller.color) {
                        // Update the object property first
                        if (controller.color.object && controller.color.property) {
                            controller.color.object[controller.color.property] = colors[index];
                        }
                        // Then update the display
                        if (controller.color.updateDisplay) {
                            controller.color.updateDisplay();
                        }
                    }
                });
            }
            
            // Update all slider controllers in gas planet folder
            if (typeof folderGas !== 'undefined' && folderGas.controllers) {
                // Update all controllers (sliders, colors, percentages)
                folderGas.controllers.forEach(controller => {
                    // Update the object property if it exists
                    if (controller.object && controller.property && params.hasOwnProperty(controller.property)) {
                        controller.object[controller.property] = params[controller.property];
                    }
                    // Update display
                    if (controller.updateDisplay) {
                        controller.updateDisplay();
                    }
                });
            }
            
            // Final GUI update
            gui.updateDisplay();
        }

        const folderGas = gui.addFolder('Gas Planet');
        
        // Gas Planet Size - automatically adjusts stripe frequency based on size
        addSliderWithPercentAndLock(
            folderGas, 'gasPlanetSize', 'Planet Size', 0.5, 2.0,
            v => {
                planet.scale.setScalar(v);
                atmosphere.scale.setScalar(v * 1.15);
                
                // Scale stripe frequency with planet size: size 0.5 -> freq 1.0, size 2.0 -> freq 5.0
                // Linear mapping: frequency = 1.0 + (size - 0.5) / (2.0 - 0.5) * (5.0 - 1.0)
                if (!locks.gasStripeFrequency) {
                    const newFreq = 1.0 + ((v - 0.5) / 1.5) * 4.0;
                    // Update via wrapper to trigger slider update
                    if (percentWrappers.gasStripeFrequency) {
                        // Calculate percentage: (value - min) / (max - min) * 100
                        const freqPercent = ((newFreq - 1.0) / (5.0 - 1.0)) * 100;
                        percentWrappers.gasStripeFrequency.value = freqPercent;
                    } else {
                        // Fallback if wrapper not yet created
                        params.gasStripeFrequency = newFreq;
                        gasUniforms.uStripeFrequency.value = params.gasStripeFrequency;
                    }
                }
            }
        );
        
        // Stripe Speed with percentage display
        addSliderWithPercentAndLock(
            folderGas, 'gasStripeSpeed', 'Stripe Speed', 0.0, 0.035,
            v => gasUniforms.uStripeSpeed.value = v
        );
        
        // Stripe Frequency - auto-adjusted by planet size
        const stripeFreqSliderCtrl = addSliderWithPercentAndLock(
            folderGas, 'gasStripeFrequency', 'Stripe Frequency', 1.0, 5.0,
            v => gasUniforms.uStripeFrequency.value = v
        );
        
        // Stripe Sharpness
        addSliderWithPercentAndLock(
            folderGas, 'gasStripeSharpness', 'Stripe Sharpness', 0.5, 5.0,
            v => gasUniforms.uStripeSharpness.value = v
        );
        
        // Turbulence with percentage display (0.5-1.0 range)
        addSliderWithPercentAndLock(
            folderGas, 'gasTurbulence', 'Turbulence', 0.5, 1.0,
            v => gasUniforms.uTurbulence.value = v
        );
        
        // Style presets
        const presetNames = Object.keys(gasPlanetPresets);
        folderGas.add({preset: 'Jupiter'}, 'preset', presetNames).name('Style Preset').onChange(v => applyGasPlanetPreset(v));
        
        // Randomize button
        folderGas.add({randomize: () => randomizeGasPlanet()}, 'randomize').name('🎲 Randomize');
        
        // Store references to color controllers for updating
        const colorControllers = {
            color1: addColorWithLock(folderGas, 'gasColor1', 'Color 1', v => gasUniforms.uColor1.value.set(v)),
            color2: addColorWithLock(folderGas, 'gasColor2', 'Color 2', v => gasUniforms.uColor2.value.set(v)),
            color3: addColorWithLock(folderGas, 'gasColor3', 'Color 3', v => gasUniforms.uColor3.value.set(v)),
            color4: addColorWithLock(folderGas, 'gasColor4', 'Color 4', v => gasUniforms.uColor4.value.set(v)),
            color5: addColorWithLock(folderGas, 'gasColor5', 'Color 5', v => gasUniforms.uColor5.value.set(v))
        };
        folderGas.close();

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            uniforms.uTime.value = clock.elapsedTime;
            gasUniforms.uTime.value = clock.elapsedTime; // Update gas planet time too

            // Rotate planet
            planet.rotation.y += params.rotationSpeed * delta;
            cloudMesh.rotation.y += params.rotationSpeed * delta * 1.2; // Clouds move slightly faster
            atmosphere.rotation.y += params.rotationSpeed * delta * 0.1; // Atmosphere barely rotates visually if uniform, but good for consistency if we added noise to it.

            // Slowly rotate stars for dynamic background
            stars.rotation.y -= delta * 0.005;

            controls.update();
            renderer.render(scene, camera);
        }

        // Hide loading text once initialized
        document.getElementById('loading').style.opacity = 0;

        // Handle window resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        animate();
    </script>
</body>
